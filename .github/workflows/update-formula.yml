name: Update Formula

# Keeps Formula/shelve.rb pointed at the newest shelve release.
#
# Triggered by repository_dispatch (event_type: "release") from matagus/shelve's
# release workflow. `workflow_dispatch` allows a manual bump. Note that this tap
# intentionally carries NO version tags: a tag pushed here would re-trigger the
# `push: tags` event below and double-fire the bump.

on:
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to bump to, without the leading v (e.g. 0.4.2)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_REPO: matagus/shelve
  FORMULA: shelve

jobs:
  bump:
    name: Bump source formula
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Homebrew
        uses: Homebrew/actions/setup-homebrew@2026.09.21.1

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          raw="${{ github.event.client_payload.version || inputs.version }}"
          raw="${raw#v}"
          if [[ ! "$raw" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::could not resolve a semver version from '$raw'"
            exit 1
          fi
          echo "version=$raw" >> "$GITHUB_OUTPUT"
          echo "tag=v$raw" >> "$GITHUB_OUTPUT"

      - name: Compute archive checksum
        id: sum
        run: |
          set -euo pipefail
          url="https://github.com/${UPSTREAM_REPO}/archive/refs/tags/${{ steps.ver.outputs.tag }}.tar.gz"
          curl -fsSL "$url" -o /tmp/upstream.tar.gz
          sha="$(shasum -a 256 /tmp/upstream.tar.gz | awk '{print $1}')"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      - name: Rewrite formula
        env:
          URL: ${{ steps.sum.outputs.url }}
          SHA256: ${{ steps.sum.outputs.sha256 }}
        run: |
          set -euo pipefail
          # Do NOT add /m to these patterns: under /m, `$` also matches before a
          # newline, so `^  url ".*"$` would swallow every line below it.
          ruby -i -pe '
            sub(/^  url ".*"$/)    { %(  url "#{ENV["URL"]}") }
            sub(/^  sha256 ".*"$/) { %(  sha256 "#{ENV["SHA256"]}") }
          ' "Formula/${FORMULA}.rb"
          git --no-pager diff

      - name: Validate
        run: |
          set -euo pipefail
          # The tap is owner/repo => matagus/tap. `brew tap <repo>` would
          # register it under the wrong name ("homebrew-tap").
          brew tap matagus/tap
          brew style "Formula/${FORMULA}.rb"
          # Homebrew disabled `brew audit <path>`; pass the formula name and let
          # it resolve through the registered tap.
          brew audit --strict "${FORMULA}"

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/bump-shelve-${{ steps.ver.outputs.tag }}
          title: "shelve ${{ steps.ver.outputs.tag }}"
          commit-message: "shelve ${{ steps.ver.outputs.tag }}"
          body: |
            Automated bump of the `shelve` formula to ${{ steps.ver.outputs.tag }}.

            - url: `${{ steps.sum.outputs.url }}`
            - sha256: `${{ steps.sum.outputs.sha256 }}`

            Generated by `.github/workflows/update-formula.yml`.

      - name: Auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          number="$(gh pr list --repo "${{ github.repository }}" \
            --head "bot/bump-shelve-${{ steps.ver.outputs.tag }}" \
            --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            echo "No pull request opened (formula already up to date)."
            exit 0
          fi
          gh pr merge "$number" --repo "${{ github.repository }}" \
            --admin --squash --delete-branch
