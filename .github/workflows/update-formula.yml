name: Update Formula

# Keeps Formula/shelve.rb pointed at the newest shelve release.
#
# Triggered by repository_dispatch (event_type: "release") from the shelve
# repository's release workflow, so publishing a GitHub release is the only
# step a human has to take. `workflow_dispatch` allows a manual bump, and
# `push: tags` covers a tag pushed directly onto this tap.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]*"
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to bump to, without the leading v (e.g. 0.4.2)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_REPO: matagus/shelve

jobs:
  bump:
    name: Bump shelve formula
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Resolve version
        id: ver
        run: |
          raw="${{ github.event.client_payload.version || github.ref_name || inputs.version }}"
          raw="${raw#v}"
          if [[ ! "$raw" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::could not resolve a semver version from '$raw'"
            exit 1
          fi
          echo "version=$raw" >> "$GITHUB_OUTPUT"
          echo "tag=v$raw" >> "$GITHUB_OUTPUT"

      - name: Compute archive checksum
        id: sum
        run: |
          url="https://github.com/${UPSTREAM_REPO}/archive/refs/tags/${{ steps.ver.outputs.tag }}.tar.gz"
          curl -fsSL "$url" -o /tmp/upstream.tar.gz
          sha="$(shasum -a 256 /tmp/upstream.tar.gz | awk '{print $1}')"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "url -> $url"
          echo "sha256 -> $sha"

      - name: Rewrite formula
        env:
          URL: ${{ steps.sum.outputs.url }}
          SHA256: ${{ steps.sum.outputs.sha256 }}
        run: |
          set -euo pipefail
          file=Formula/shelve.rb
          # Anchor each substitution to the start of its own line. Ruby hands
          # `$` an anchor that also matches before a newline when /m is used, so
          # keep /m off these two patterns or the block below gets swallowed.
          ruby -i -pe '
            sub(/^  url ".*"$/)     { %(  url "#{ENV["URL"]}") }
            sub(/^  sha256 ".*"$/)  { %(  sha256 "#{ENV["SHA256"]}") }
          ' "$file"
          git --no-pager diff

      - name: Validate with brew style and audit
        run: |
          set -euo pipefail
          brew style Formula/shelve.rb
          # Tap formulas are audited by path; `--formula` expects an installed
          # tap name, which does not exist yet in this checkout.
          brew audit --strict --new-formula Formula/shelve.rb || \
            brew audit --strict Formula/shelve.rb

      - name: Open pull request
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/bump-shelve-${{ steps.ver.outputs.tag }}
          title: "shelve ${{ steps.ver.outputs.tag }}"
          commit-message: "shelve ${{ steps.ver.outputs.tag }}"
          body: |
            Automated bump of the `shelve` formula to ${{ steps.ver.outputs.tag }}.

            - url: `${{ steps.sum.outputs.url }}`
            - sha256: `${{ steps.sum.outputs.sha256 }}`

            Generated by `.github/workflows/update-formula.yml`.

      - name: Auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          number="$(gh pr list --repo "${{ github.repository }}" \
            --head "bot/bump-shelve-${{ steps.ver.outputs.tag }}" \
            --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            echo "No pull request opened (formula already up to date)."
            exit 0
          fi
          gh pr merge "$number" --repo "${{ github.repository }}" \
            --admin --squash --delete-branch
